services:
  # Redis for session state, distributed locks, and WebSocket adapter
  redis:
    image: redis:7-alpine
    container_name: fittalk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # PostgreSQL (optional - only if not using Supabase)
  # Uncomment if you want local PostgreSQL instead of Supabase
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: fittalk-postgres
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: fittalk
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #   restart: unless-stopped

volumes:
  redis-data:
    driver: local
